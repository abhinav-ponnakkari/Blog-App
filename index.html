<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhinav P</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <script src="nav.js" defer></script>
</head>

<body>
    <nav class="nav">
        <div class="nav__logo"><a href="/"> Abhinav P</a></div>
        <a class="nav__hamburger">
            <span class="nav__hamburger__line"></span>
            <span class="nav__hamburger__line"></span>
            <span class="nav__hamburger__line"></span>
        </a>
        <div class="nav__menu">
            <div>
                <div class="register-div">
                    <h1>Register</h1>
                    <form id="register form">
                        <input type="text" id="register-username" placeholder="Username" />
                        <input type="text" id="register-password" placeholder="password" />
                        <select id="register-role">
                            <option value="reader"></option>
                            <option value="admin"></option>
                        </select>
                        <button type="submit">Register</button>
                    </form>
                </div>
                <div id="logout-div">
                    <h2 id="username">Username</h2>
                    <button id="logout-button">Logout</button>
                </div>
                <div id="login-div">
                    <h1>Login</h1>
                    <form id="login-form">
                        <input type="text" id="login-username" placeholder="Username" />
                        <input type="password" id="login-password" placeholder="Password" />
                    </form>
                    <button id="login-button" type="submit">Login</button>
                </div>

            </div>
        </div>
    </nav>
    <main>
        <!--Get back here -->
        <div id="posts-list">
            <div id="post-id" class="post">
                <img src="https://plus.unsplash.com/premium_photo-1671599016130-7882dbff302f?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="Image" />
                    <div class="post-title">
                        <h1><a href="#">Post Title for a nice post</a></h1>
                    </div>
                    <span>
                        <p>Author</p>
                        <p>Timestamp</p>
                    </span>
                    <div id="admin-buttons">
                    <div class="btn">Delete</div>
                    <div class="btn">Create</div>
                </div>
            </hr>
            </div>
        </div>
        <div id="new-post-div" style="display: none;">
            <h2>'New post</h2>
            <form id="new-post-form">
                <input type="text" id="title" placeholder="Title" />
                <textarea id="content" placeholder="Content"></textarea>
                <input type="text" id="image-url" placeholder="Image URL" />
                <button type="submit"> Create post</button>
            </form>
            <div id="post-detail-container"></div>
        </div>

    </main>
    <footer>
        <h3>Abhinav P</h3>
        <p>
            Lorem ipsum dolor, sit amet consectetur adipisicing elit. Tenetur exercitationem accusantium vitae
            reprehenderit tempore voluptas similique, quaerat iusto iste eveniet?
        </p>
        <span>
            <p>&copy;</p>
            <script>
                document.write(new Date().getFullYear());
            </script>
        </span>
    </footer>
</body>

</html>
